[project]
name = "model-services"
version = "0.1.0"
description = "BentoML model services for ragent retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4.39,<1.5",
    "numpy==2.3.5",
    "pydantic>=2.11",
    "sentence-transformers==5.6.0",
    "torch==2.11.0",
    "transformers==5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_services"]
