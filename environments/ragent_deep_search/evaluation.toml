model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 1
max_concurrent = 5
push = true

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "OPENAI_API_KEY"

[env.taskset]
id = "ragent_deep_search"
dataset_path = "../../data_pipelines/data/entity_fact_qa/browsecomp_plus_corpus_20260719T160440Z_5000e_2f4a9241/rubric_finalize_20260919T115809Z_7880dba2/question_rubrics.jsonl"
split = "test"

[env.taskset.tools]
namespace = "default"
device = "cuda"
retrieval_mode = "bm25"
env_file = ".env"

[env.taskset.task.judge]
model = "deepseek/deepseek-v4.1-flash"
max_criteria = 8

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
