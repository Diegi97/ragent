model = "deepseek/deepseek-v4-flash-0731"
num_rollouts = 1
max_concurrent = 5
push = true

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "OPENAI_API_KEY"

[env.taskset]
id = "ragent_deep_search"
dataset_path = "diegi97/ragent-rubrics"
split = "test"

[env.taskset.tools]
namespace = "default"
device = "cuda"
retrieval_mode = "bm25"
env_file = ".env"

[env.taskset.task.judge]
model = "z-ai/glm-5.3-flash"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
max_criteria = 8

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
