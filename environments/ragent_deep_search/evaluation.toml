model = "deepseek/deepseek-v4-flash"
num_rollouts = 1
max_concurrent = 5
push = false

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "OPENAI_API_KEY"

[taskset]
id = "ragent_deep_search"
dataset_path = "diegi97/ragent-rubrics"
split = "test"

[taskset.tools]
namespace = "default"
retrieval_mode = "bm25"

[taskset.task.judge]
model = "openai/gpt-5.6-luna"
max_criteria = 6

[harness]
id = "null"

[harness.runtime]
type = "subprocess"