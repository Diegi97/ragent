# Generate retrieval-assisted answers and criterion-at-a-time teacher labels.
# Verifiers shuffles with its fixed seed (0), so this selects a reproducible subset.
model = "deepseek/deepseek-v4-flash-0731"
num_tasks = 50
num_rollouts = 1
shuffle = true
max_concurrent = 5
push = false

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "OPENAI_API_KEY"

[taskset]
id = "ragent_deep_search"
dataset_path = "diegi97/ragent-rubrics"
split = "test"
# The taskset limits rows before the top-level shuffle. Keep this above the split size
# so num_tasks is sampled from the complete split rather than only its first rows.
num_tasks = 1000000

[taskset.tools]
namespace = "default"
retrieval_mode = "bm25"

[taskset.task.judge]
model = "openai/gpt-5.6-sol"
# One independent strong teacher call per criterion creates the ground-truth labels.
max_criteria = 1
view = "last_reply"

[harness]
id = "null"

[harness.runtime]
type = "subprocess"
