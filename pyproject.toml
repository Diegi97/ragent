[project]
name = "ragent-dev"
version = "0.0.0"
description = "Repository-wide development tooling for RAGent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.15.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
required-version = "==0.15.16"
extend-exclude = ["verifiers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["lancedb"]
known-first-party = [
    "ragent_deep_search",
    "data_pipelines",
    "model_services",
    "ragent_core",
]
