[project]
name = "data-pipelines"
version = "0.1.0"
description = "Prefect and Phoenix synthetic-data pipelines for RAGent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.10.0",
    "arize-phoenix-otel>=0.16.0,<1",
    "datasets>=4.6.1,<5",
    "filelock>=3.18.0",
    "huggingface-hub>=1.16.1,<2",
    "httpx>=0.28.1",
    "openai>=1.101.0",
    "openinference-instrumentation-openai>=0.1.41",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "prefect>=3.4.19,<4",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "ragent-core",
    "typer>=0.16.0",
]

[project.scripts]
generate-search-queries = "data_pipelines.cli:app"
deep-search-tasks = "data_pipelines.cli:deep_search_tasks_app"
evaluate-retrieval = "data_pipelines.cli:evaluation_app"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.uv.sources]
ragent-core = { path = "../ragent_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipelines"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
